name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
    
    - name: Test connection script
      run: |
        python -c "import sys; sys.path.insert(0, 'scripts'); from deepseek_client import DeepSeekClient; print('Import successful')"

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Check README
      run: |
        if [ -f README.md ]; then
          echo "✅ README.md exists"
          wc -l README.md
        else
          echo "❌ README.md missing"
          exit 1
        fi
