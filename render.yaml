# Render.com deployment configuration
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: clawdbot-deepseek
    runtime: python
    plan: standard
    region: oregon
    
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: python app.py
    
    # Environment variables
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false  # Set via Render dashboard
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
      - key: WORKSPACE_PATH
        value: /data/workspace
    
    # Persistent disk for memory files
    disk:
      name: workspace
      mountPath: /data/workspace
      sizeGB: 1
    
    # Auto-deploy on git push
    autoDeploy: true
    
    # Health check
    healthCheckPath: /health

  - type: worker
    name: clawdbot-telegram-worker
    runtime: python
    plan: standard
    region: oregon

    buildCommand: pip install -r requirements-deploy.txt
    startCommand: python plugins/telegram_bot.py

    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: AI_PROVIDER
        value: deepseek
      - key: COMMUNITY_TRANSPORT
        value: telegram
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_REASONING_MODEL
        value: deepseek-v4-pro
      - key: TELEGRAM_REQUIRE_COMMAND
        value: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: WORKSPACE_PATH
        value: /data/workspace

    disk:
      name: workspace-worker
      mountPath: /data/workspace
      sizeGB: 1

    autoDeploy: true
